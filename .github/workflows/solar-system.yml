name: Solar System Workflow

on: 
  workflow_dispatch:
  push:
    branches:
      - main
      - 'feature/*'
env:
  MONGO_URI: 'mongodb+srv://${{ vars.MONGO_USERNAME }}:${{ secrets.MONGO_PASSWORD }}@cluster0.cmupoph.mongodb.net/?appName=Cluster0'
  MONGO_USERNAME: ${{ vars.MONGO_USERNAME }}
  MONGO_PASSWORD: ${{ secrets.MONGO_PASSWORD }}

jobs:
    unit-testing:
        name: Unit Testing
        services:
          mongo:
            image: siddharth67/mongo-db:non-prod
            ports:
              - 27017:27017
            env:
              MONGO_URI: 'mongodb://localhost:27017/superData'
              MONGO_USERNAME: non-prod-user
              MONGO_PASSWORD: non-prod-password
        strategy:
          matrix:
            node-version: [18, 19, 20]
            os: [ubuntu-latest]

        runs-on: ${{ matrix.os }}
        steps:
        - name: Checkout Repository
          uses: actions/checkout@v7

        - name: Setup NodeJS Version - ${{ matrix.node-version }}
          uses: actions/setup-node@v7
          with:
            node-version: ${{ matrix.node-version }}
    
        - name: Cache Node Modules
          uses: actions/cache@v3
          with:
            path: node_modules
            key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}

        - name: Install Dependencies
          run: npm install
    
        - name: Unit Testing
          id: unit-testing
          run: npm test
          
        - name: Archive Test Result
          if: always()
          uses: actions/upload-artifact@v4
          with:
            name: Mocha-Test-Result
            path: test-results.xml

    code-coverage:
        name: Code Coverage
        container: 
          image: node:20
        services:
          mongo:
            image: siddharth67/mongo-db:non-prod
            options:                              # Options to pass to the service container
                --name mongo    
            env:
              MONGO_URI: 'mongodb://mongo:27017/superData'
              MONGO_USERNAME: non-prod-user
              MONGO_PASSWORD: non-prod-password
        runs-on: ubuntu-latest
        steps:
        - name: Checkout Repository
          uses: actions/checkout@v7

        # - name: Setup NodeJS Version
        #   uses: actions/setup-node@v7
        #   with:
        #     node-version: 20

        - name: Cache Node Modules
          uses: actions/cache@v3
          with:
            path: node_modules
            key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}

        - name: Install Dependencies
          run: npm install
    
        - name: Code Coverage
          continue-on-error: true
          run: npm run coverage
          
        - name: Archive Code Coverage Result
          uses: actions/upload-artifact@v4
          with:
            name: Code-Coverage-Result
            path: coverage
            retention-days: 5

    docker:
        name: Containerization
        needs: [unit-testing, code-coverage]
        permissions: 
          packages: write
        runs-on: ubuntu-latest
        steps:
        - name: Checkout Repository
          uses: actions/checkout@v7

        - name: Log in to DockerHub
          uses: docker/login-action@v3
          with:
            username: ${{ vars.DOCKER_USERNAME }}
            password: ${{ secrets.DOCKER_PASSWORD }}

        - name: GHCR Login
          uses: docker/login-action@v3
          with:
            registry: ghcr.io
            username: ${{ github.repository_owner }}
            password: ${{ secrets.GITHUB_TOKEN }}

        - name: Set up QEMU
          uses: docker/setup-qemu-action@v3

        - name: Set up Docker Buildx
          uses: docker/setup-buildx-action@v3

        - name: Build Docker Image
          uses: docker/build-push-action@v5
          with:
            context: .
            push: false
            load: true
            tags: ${{ vars.DOCKER_USERNAME }}/solar-system:${{ github.sha }}

        - name: Docker Image Test
          run: |
            docker images
            docker run --name solar-system-app -d \
              -p 3000:3000 \
              -e MONGO_URI="${{ env.MONGO_URI }}" \
              -e MONGO_USERNAME="${{ env.MONGO_USERNAME }}" \
              -e MONGO_PASSWORD="${{ env.MONGO_PASSWORD }}" \
              ${{ vars.DOCKER_USERNAME }}/solar-system:${{ github.sha }}

            export IP=$(docker inspect -f '{{range.NetworkSettings.Networks}}{{.IPAddress}}{{end}}' solar-system-app)
            echo "IP Address of the container: $IP"

            echo "Testing image URI using wget"
            wget -q -O - 127.0.0.1:3000/live | grep live

        - name: Container Registry Push
          uses: docker/build-push-action@v5
          with:
            context: .
            platforms: linux/amd64,linux/arm64
            push: true
            tags: |
              ${{ vars.DOCKER_USERNAME }}/solar-system:${{ github.sha }}
              ghcr.io/${{ github.repository_owner }}/solar-system:${{ github.sha }}

    dev-deployment:
        needs: docker
        outputs:
          APP_INGRESS_URL: ${{ steps.set-app-ingress-host-url.outputs.APP_INGRESS_HOST }}
        runs-on: ubuntu-latest
        steps:
        - name: Checkout Repository
          uses: actions/checkout@v7

        - name: Install kubectl
          uses: azure/setup-kubectl@v3
          with:
            version: 'v1.36.1'

        - name: Setup Kubeconfig
          uses: azure/k8s-set-context@v3
          with:
            method: kubeconfig
            kubeconfig: ${{ secrets.KUBECONFIG }}

        - name: Fetch K8s Cluster Details
          run: |
            kubectl version
            echo "------------------------------"
            kubectl get nodes

        - name: Save Ingress IP to Environment Variable as Github Environment Variable
          run: |
            echo "INGRESS_IP=141.148.175.20" >> $GITHUB_ENV

        - name: Replace Token in Deployment YAML
          uses: cschleiden/replace-tokens@v1
          with:
            tokenPrefix: '_{_'
            tokenSuffix: '_}_'
            files: '["kubernetes/development/*.yaml"]'
          env:
            NAMESPACE: ${{ vars.NAMESPACE }}
            REPLICAS: ${{ vars.REPLICAS }}
            IMAGE: ${{ vars.DOCKER_USERNAME }}/solar-system:${{ github.sha }}
            INGRESS_IP: ${{ env.INGRESS_IP }}

        - name: Check Deployment YAML
          run: |
            cat kubernetes/development/deployment.yaml
            echo "------------------------------"
            cat kubernetes/development/service.yaml
            echo "------------------------------"
            cat kubernetes/development/ingress.yaml

        - name: Create MongoDB Secret in Kubernetes
          run: |
            kubectl -n ${{ vars.NAMESPACE }} create secret generic mongo-db-creds \
              --from-literal=MONGO_URI="${{ env.MONGO_URI }}" \
              --from-literal=MONGO_USERNAME="${{ vars.MONGO_USERNAME }}" \
              --from-literal=MONGO_PASSWORD="${{ secrets.MONGO_PASSWORD }}" \
              --save-config \
              --dry-run=client -o yaml | kubectl apply -f -

        - name: Deploy to Development Environment
          run: |
            kubectl apply -f kubernetes/development/deployment.yaml
            kubectl apply -f kubernetes/development/service.yaml
            kubectl apply -f kubernetes/development/ingress.yaml

        - name: Set App Ingress Host URL
          run: |
            echo "APP_INGRESS_HOST=$(kubectl -n ${{ vars.NAMESPACE }} get ingress -o jsonpath='{.items[0].spec.rules[0].host}')" >> $GITHUB_ENV
            echo "APP_INGRESS_HOST: ${{ env.APP_INGRESS_HOST }}"

    integration-testing:
          name: Integration Testing
          needs: dev-deployment
          runs-on: ubuntu-latest
          steps:
            - name: Test URL output using curl and JQ
              env:
                URL: ${{ needs.dev-deployment.outputs.APP_INGRESS_URL }}
              run: |
                echo $URL
                echo "------------------------------"
                curl -s $URL/live -s -k | jq -r .status | grep -i live
